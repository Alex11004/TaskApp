<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | TaskApp</title>
    <link rel="stylesheet" href="../../styles/login/login.css">
</head>
<body>

    <section class="login">
        <div class="login-header">
            <a class="back" href="../landing/landing.html">←</a>
            <h1>Inicia sesión</h1>
        </div>

        <p>Bienvenido de vuelta</p>

        <form class="login-form">

            <input type="password" placeholder="Contraseña" required>

            <button type="submit">Iniciar sesión</button>
        </form>

        <p class="ruta-registro">
            ¿No tienes una cuenta? <a href="../registro/registro.html">Regístrate</a>
        </p>
        
    </section>
    
</body>
</html>
