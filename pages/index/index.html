<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | TaskApp</title>
    <link rel="stylesheet" href="../../styles/index/index.css">
</head>
<body>

    <header>

        <nav>
            <div class="logo">
                <h1>TaskApp</h1>
            </div>

            <div class="categorias">

                <a href="index.html">Inicio</a>

                <a href="#">Tareas</a>

                <a href="#">Perfil</a>

                <a href="#">Configuración</a>

                <a href="../landing/landing.html">Salir</a>
            </div>
        </nav>
    </header>

    <main class="app-main">

        <section class="dashboard-header">

            <h2>Bienvenido</h2>

            <p>Tienes tareas pendientes.</p>

        <section class="tasks">

            <h3 class="section-title">Mis tareas</h3>

                    <div class="task-info">

                            <h4>Estudiar CSS</h4>
                        </div>
                        
                        <p>Practicar flexbox y grid haciendo ejercicios.</p>

                    </div>

                    <button class="task-btn">Detalles</button>

                </div>

                <div class="task-card">

                    <div class="task-info">
                        
                        <div class="task-title-row">
                            <h4>DER</h4>
                        </div>
                        
                        <p>Investigar sobre los diagramas de entidad-relación.</p>

                    </div>

                    <button class="task-btn">Detalles</button>

                </div>

                <div class="task-card">

                    <div class="task-info">
                        
                        <div class="task-title-row">
                            <h4>Repasar JS</h4>
                        </div>
                        
                        <p>Leer y sacar un resumen de los apuntes de clase.</p>

                    </div>

                    <button class="task-btn">Detalles</button>

                </div>

            </div>
        </section>
